{% extends 'base.html' %}

{% block heading %}
Add an incident
{% endblock %}

{% block content %}
<form action = "/incidents" method="POST">
    <form class="form-horizontal">
        <div class="form-group">
          <label class="col-sm-2 control-label"></label>
          <div class="col-sm-10">
            <p class="form-control-static"></p>
          </div>
        </div>
        <div class="form-group">
          <label for="inputPassword" class="col-sm-2 control-label">Incidents</label>
          <div class="col-sm-10">
            <input type="password" class="form-control" id="inputPassword" placeholder="Name">
          </div>
        </div>
      </form>
</form>
{% endblock %}
