<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Cyberwatch is a vulnerability tracking system for managing and monitoring security incidents.">
        <title>{% block title %}Cyberwatch{% endblock %}</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

        <link rel='stylesheet' href='/static/css/styles.css'>
        <link rel='manifest' href='/static/manifest.json'>
    </head>

    <body>

        <h1>Cyberwatch</h1>
        <img src="/static/icons/icon-192x192.png" height="70" alt="Cyberwatch logo">

        <h2>{% block heading %}Vulnerabilities tracker{% endblock %}</h2>

        <main class="content">
            {% block content %}{% endblock %}
        </main>

        <audio id="hitSound" preload="auto">
            <source src="/static/sounds/cinematic-hit.mp3" type="audio/mpeg">
        </audio>
        
        <audio id="damageSound" preload="auto">
            <source src="/static/sounds/damage-ring.mp3" type="audio/mpeg">
        </audio>

        <script src="/static/js/script.js"></script>

        <script>
function playSoundThenNavigate(audioId, href) {
    const audio = document.getElementById(audioId);
    if (!audio || !href) return;
    audio.currentTime = 0;
    const promise = audio.play();

    if (promise !== undefined) {
        promise.then(() => {
            setTimeout(() => { window.location.href = href; }, 400);
        }).catch(() => {
            window.location.href = href;
        });
    } else {
        setTimeout(() => { window.location.href = href; }, 400);
    }
}

document.addEventListener("click", function (e) {
    const hitBtn    = e.target.closest(".sound-hit");
    const damageBtn = e.target.closest(".sound-damage");

    if (hitBtn && hitBtn.tagName === "A") {
        e.preventDefault();
        playSoundThenNavigate("hitSound", hitBtn.href);

    } else if (damageBtn && damageBtn.tagName === "A") {
        e.preventDefault();
        playSoundThenNavigate("damageSound", damageBtn.href);

    } else if (damageBtn && damageBtn.type === "submit") {
        const form = damageBtn.closest("form");
        if (form) {
            e.preventDefault();
            const audio = document.getElementById("damageSound");
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(() => {});
            }
            setTimeout(() => form.submit(), 400);
        }
    }
});
        </script>

    </body>
</html>
